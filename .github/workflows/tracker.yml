name: Euro price tracker

on:
  schedule:
    - cron: "17 */3 * * *"   # co 3 godziny
  workflow_dispatch: {}       # ręczne uruchomienie z zakładki Actions

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 playwright
      - run: python -m playwright install --with-deps chromium
      - name: Run tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_DISCOUNT: "70"
          USE_BROWSER: "1"
          MAX_PAGES: "10"
        run: python tracker.py
      - name: Save state
        if: always()
        run: |
          git config user.name "tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/seen.json || true
          git diff --cached --quiet || (git commit -m "update state" && git push)
